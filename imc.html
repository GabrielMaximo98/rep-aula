<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC do Gabriel</title>
    <style>
        /* CSS Básico e Responsivo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Garante que o padding não aumente a largura */
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 6px;
            display: none; /* Escondido até o cálculo */
        }

        .info {
            background-color: #e7f3ff;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Calculadora de IMC</h1>
        
        <div class="input-group">
            <label for="weight">Peso (kg)</label>
            <input type="number" id="weight" placeholder="Ex: 75.5" step="0.1">
        </div>

        <div class="input-group">
            <label for="height">Altura (cm)</label>
            <input type="number" id="height" placeholder="Ex: 175">
        </div>

        <button onclick="calculateIMC()">Calcular IMC</button>

        <div id="result"></div>
    </div>

    <script>
        function calculateIMC() {
            const weightInput = document.getElementById('weight');
            const heightInput = document.getElementById('height');
            const resultDiv = document.getElementById('result');

            const weight = parseFloat(weightInput.value);
            const heightCm = parseFloat(heightInput.value);

            // Validação simples
            if (!weight || !heightCm || weight <= 0 || heightCm <= 0) {
                alert("Por favor, insira valores válidos para peso e altura.");
                return;
            }

            // Conversão de altura para metros e cálculo
            const heightM = heightCm / 100;
            const imc = (weight / (heightM * heightM)).toFixed(2);

            let classification = "";
            let statusClass = "";

            // Lógica de classificação baseada na OMS
            if (imc < 18.5) {
                classification = "Abaixo do peso";
                statusClass = "warning";
            } else if (imc < 25) {
                classification = "Peso normal";
                statusClass = "success";
            } else if (imc < 30) {
                classification = "Sobrepeso";
                statusClass = "warning";
            } else if (imc < 35) {
                classification = "Obesidade Grau I";
                statusClass = "danger";
            } else if (imc < 40) {
                classification = "Obesidade Grau II";
                statusClass = "danger";
            } else {
                classification = "Obesidade Grau III";
                statusClass = "danger";
            }

            // Exibição do resultado
            resultDiv.style.display = "block";
            resultDiv.className = statusClass;
            resultDiv.innerHTML = `<strong>Seu IMC é: ${imc}</strong><br>${classification}`;
        }
    </script>

</body>
</html>
